name: Update monthly data

on:
  schedule:
    - cron: "10 0 * * *"  # 毎日 00:10 UTC（日本時間 09:10）。日足確定の10分後
  workflow_dispatch:       # Actions画面から手動実行できるようにする

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Bitstamp and recompute recent months
        run: python3 scripts/update.py

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monthly.json
          git commit -m "Update data $(date -u +%Y-%m-%d)"
          git push

      - name: Purge jsDelivr cache
        run: curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/monthly.json" || true
